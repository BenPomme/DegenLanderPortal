  body { background:#05060a; color:#7b93a6; font-family:ui-monospace,Menlo,monospace;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
  a { color:#00ff9d; }

<body>
<p>Taking you to the game... <a href="index.html">tap here if nothing happens</a></p>
<script>
/* This used to be a separate copy of the game with its own physics, which had
   no delta-time, gravity that doubled as your score rose, thrust that halved as
   your score rose, and walls that killed your velocity dead. Keeping four
   near-identical builds around meant it was possible to land on a broken one by
   accident, which is exactly what happened.

   There is now one lander: index.html. This file exists only so old links,
   bookmarks and the direct-launch page keep working. */
(function () {
  var q = window.location.search || '';
  // Map the old direct-launch parameter names onto the current ones.
  q = q.replace(/\bstockSymbol=/g, 'ticker=');
  window.location.replace('index.html' + q);
})();
</script>
</body>
